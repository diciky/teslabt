# XiaoZhiFlasher iOS tipa 构建（GitHub Actions）
#
# tipa 只能在 macOS + Xcode 上编译。这里用 GitHub 托管的 macOS 云构建机（macos-14）。
# TrollStore 设备直接安装 .tipa，无需签名，因此构建时禁用代码签名。
name: Build XiaoZhiFlasher tipa

on:
  push:
    branches: [ main, auto/xiaozhi-flasher-f104 ]
    paths:
      - 'XiaoZhiFlasher/**'
      - '.github/workflows/build-tipa.yml'
  workflow_dispatch:

jobs:
  build-tipa:
    name: Build XiaoZhiFlasher.tipa
    runs-on: macos-14
    defaults:
      run:
        working-directory: XiaoZhiFlasher
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Build app (no signing for TrollStore)
        run: |
          set +e
          xcodebuild \
            -project XiaoZhiFlasher.xcodeproj \
            -scheme XiaoZhiFlasher \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/xcodebuild.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "=== xcodebuild 失败 (exit $rc)，错误摘要 ==="
            grep -E "error:|BUILD FAILED|Command .* failed|\.swift:[0-9]" /tmp/xcodebuild.log | tail -60
            exit $rc
          fi
          set -e

      - name: Package tipa
        run: |
          set -e
          APP=$(find build/Build/Products -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then echo "未找到 .app 产物"; exit 1; fi
          cd "$(dirname "$APP")"
          rm -f XiaoZhiFlasher.tipa
          zip -r XiaoZhiFlasher.tipa "$(basename "$APP")"
          ls -lh XiaoZhiFlasher.tipa

      - name: Upload tipa artifact
        uses: actions/upload-artifact@v5
        with:
          name: XiaoZhiFlasher-tipa
          path: XiaoZhiFlasher/build/Build/Products/**/XiaoZhiFlasher.tipa
          if-no-files-found: error
